<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0B1E3A" />
    <title>受电弓智能检修系统</title>
    <style>
      :root {
        --primary-dark: #0b1e3a;
        --primary-light: #12305c;
        --accent: #17e6a1;
        --text-main: #1c2b3a;
        --text-sub: #6b7a8c;
        --line: #e3e9f0;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100dvh;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #eef2f7;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      /* ===== 顶部标题栏 ===== */
      .app-header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: linear-gradient(90deg, #0b1e3a 0%, #12305c 100%);
        box-shadow: 0 2px 8px rgba(11, 30, 58, 0.25);
        position: relative;
        z-index: 10;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .status-dot {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 230, 161, 0.18);
        animation: pulse 2.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgba(23, 230, 161, 0.18);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(23, 230, 161, 0.06);
        }
      }

      .app-title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .header-tag {
        flex: 0 0 auto;
        margin-left: 12px;
        padding: 4px 12px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        white-space: nowrap;
        letter-spacing: 0.5px;
      }

      /* ===== 对话区 ===== */
      .chat-area {
        position: relative;
        height: calc(100dvh - 56px);
        background: #ffffff;
        overflow: hidden;
      }

      #chatFrame {
        display: none;
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }

      #chatFrame.visible {
        display: block;
      }

      /* 引导卡片 */
      .guide-card {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eef2f7;
      }

      .guide-card.visible {
        display: flex;
      }

      .guide-card-inner {
        max-width: 360px;
        width: 100%;
        padding: 28px 26px;
        text-align: center;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(11, 30, 58, 0.08);
      }

      .guide-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: linear-gradient(135deg, #12305c, #1c4f8f);
        color: #fff;
        font-size: 26px;
        line-height: 1;
      }

      .guide-title {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
      }

      .guide-desc {
        margin: 0;
        font-size: 13px;
        line-height: 1.7;
        color: var(--text-sub);
      }

      /* 加载动画 */
      .loading-overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        z-index: 5;
      }

      .loading-overlay.visible {
        display: flex;
      }

      .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(18, 48, 92, 0.15);
        border-top-color: #12305c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 14px;
        color: var(--text-sub);
        letter-spacing: 0.5px;
      }

      /* 超时兜底提示 */
      .timeout-toast {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 8px;
        max-width: calc(100% - 32px);
        padding: 8px 14px;
        font-size: 13px;
        color: #8a5a00;
        background: #fff7e6;
        border: 1px solid #ffe2a8;
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(138, 90, 0, 0.12);
        z-index: 6;
      }

      .timeout-toast.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- ===== 顶部标题栏 ===== -->
    <header class="app-header">
      <div class="header-left">
        <span class="status-dot" aria-hidden="true"></span>
        <h1 class="app-title">受电弓智能检修系统</h1>
      </div>
      <span class="header-tag">AI 辅助外观检测</span>
    </header>

    <!-- ===== 对话区 ===== -->
    <main class="chat-area" id="chatArea">
      <!-- 引导卡片（未配置对话链接时显示） -->
      <div class="guide-card" id="guideCard">
        <div class="guide-card-inner">
          <div class="guide-icon" aria-hidden="true">⚙</div>
          <p class="guide-title">系统准备中</p>
          <p class="guide-desc">
            请先在配置区填入智能体对话链接，即可开始智能检修辅助。
          </p>
        </div>
      </div>

      <!-- 加载动画 -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner" aria-hidden="true"></div>
        <span class="loading-text">正在连接检修助手</span>
      </div>

      <!-- 超时兜底提示 -->
      <div class="timeout-toast" id="timeoutToast" role="status">
        <span>⚠</span>
        <span>加载较慢，请检查网络或稍后刷新</span>
      </div>

      <!-- 智能体对话窗口 -->
      <iframe
        id="chatFrame"
        title="受电弓智能检修助手"
        allow="microphone; clipboard-write"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </main>

    <script>
      // ====================== 配置区 ======================
      // 把智能体发布后的公开对话链接粘贴到这里即可
      const CONFIG = {
        CHAT_URL: ""
      };
      // ====================================================

      (function () {
        var frame = document.getElementById("chatFrame");
        var loading = document.getElementById("loadingOverlay");
        var guide = document.getElementById("guideCard");
        var toast = document.getElementById("timeoutToast");

        var LOAD_TIMEOUT_MS = 8000; // 8 秒超时兜底
        var timeoutTimer = null;
        var loaded = false;
        var failed = false;

        function setup() {
          var url = (CONFIG.CHAT_URL || "").trim();

          // 未配置对话链接：显示引导卡片
          if (!url) {
            guide.classList.add("visible");
            frame.classList.remove("visible");
            resetOverlay();
            return;
          }

          // 已配置：隐藏引导卡片，开始加载
          guide.classList.remove("visible");
          frame.src = url;
          frame.classList.add("visible");
          loading.classList.add("visible");
          toast.classList.remove("visible");

          // 8 秒超时兜底
          timeoutTimer = setTimeout(function () {
            if (!loaded) {
              failed = true;
              toast.classList.add("visible");
            }
          }, LOAD_TIMEOUT_MS);
        }

        function resetOverlay() {
          loaded = false;
          failed = false;
          if (timeoutTimer) {
            clearTimeout(timeoutTimer);
            timeoutTimer = null;
          }
          loading.classList.remove("visible");
          toast.classList.remove("visible");
        }

        function onFrameLoad() {
          if (failed) {
            // 已提示超时，保持提示、去除加载层
            loading.classList.remove("visible");
            return;
          }
          loaded = true;
          if (timeoutTimer) {
            clearTimeout(timeoutTimer);
            timeoutTimer = null;
          }
          loading.classList.remove("visible");
          toast.classList.remove("visible");
        }

        frame.addEventListener("load", onFrameLoad);
        window.addEventListener("DOMContentLoaded", setup);
        if (document.readyState === "interactive" || document.readyState === "complete") {
          setup();
        }
      })();
    </script>
  </body>
</html>
