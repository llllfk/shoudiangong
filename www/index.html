<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1E3A" />
    <title>受电弓智能检修系统</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #eef2f7;
        color: #1c2b3a;
        text-align: center;
      }
      .card {
        max-width: 360px;
        padding: 28px 24px;
        background: #fff;
        border: 1px solid #e3e9f0;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(11, 30, 58, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: #6b7a8c;
      }
      code {
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>受电弓智能检修系统</h1>
      <p>
        本页为 Capacitor 离线兜底页。正式使用请在
        <code>capacitor.config.ts</code> / 环境变量
        <code>CAPACITOR_SERVER_URL</code> 配置已部署的 Next.js 服务地址。
      </p>
    </div>
  </body>
</html>
